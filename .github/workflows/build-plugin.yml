name: Build Grafana Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies & Build Frontend
        run: |
          npm install
          npm run build

      - name: Build Go Backend (Linux AMD64 & ARM64)
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/gpx_archidb-fb25-datasource ./pkg
          cp dist/gpx_archidb-fb25-datasource dist/gpx_archidb-fb25-datasource_linux_amd64
          GOOS=linux GOARCH=arm64 go build -o dist/gpx_archidb-fb25-datasource_linux_arm64 ./pkg
          chmod +x dist/gpx_archidb-fb25-datasource*

      - name: Package Plugin into ZIP dynamically
        run: |
          # Liest die Version automatisch aus der plugin.json aus (z.B. "1.0.0")
          VERSION=$(jq -r '.info.version' src/plugin.json)
          PLUGIN_ID=$(jq -r '.id' src/plugin.json)
          
          echo "Building package for plugin: $PLUGIN_ID, version: $VERSION"
          
          # Ordner für das Archiv erstellen
          mkdir -p "$PLUGIN_ID"
          cp -r dist/* "$PLUGIN_ID/"
          
          # ZIP-Datei mit dynamischem Namen erzeugen
          ZIP_NAME="${PLUGIN_ID}-${VERSION}.zip"
          zip -r "$ZIP_NAME" "$PLUGIN_ID"
          
          # Für den Artifact-Upload speichern wir den Namen in einer Env-Variable
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Plugin ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grafana-plugin-artifact
          path: "*.zip"



