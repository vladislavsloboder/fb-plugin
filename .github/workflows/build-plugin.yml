name: Build Grafana Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies & Build Frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Build Go Backend (Linux AMD64 & ARM64)
        run: |
          mkdir -p dist
          # Build für Intel/AMD 64-Bit
          GOOS=linux GOARCH=amd64 go build -o dist/gpx_archidb-fb25-datasource ./pkg
          cp dist/gpx_archidb-fb25-datasource dist/gpx_archidb-fb25-datasource_linux_amd64
          
          # Build für ARM 64-Bit (Apple Silicon / ARM Cloud)
          GOOS=linux GOARCH=arm64 go build -o dist/gpx_archidb-fb25-datasource_linux_arm64 ./pkg
          
          # Ausführungsrechte vergeben
          chmod +x dist/gpx_archidb-fb25-datasource*

      - name: Package Plugin into ZIP dynamically
        run: |
          # Liest Plugin-ID und Version aus der src/plugin.json
          VERSION=$(jq -r '.info.version' src/plugin.json)
          PLUGIN_ID=$(jq -r '.id' src/plugin.json)
          
          echo "Building package for plugin: $PLUGIN_ID, version: $VERSION"
          
          # Ordnerstruktur für das Grafana-Archiv aufbauen
          mkdir -p "$PLUGIN_ID"
          cp -r dist/* "$PLUGIN_ID/"
          
          # Archiv erstellen
          ZIP_NAME="${PLUGIN_ID}-${VERSION}.zip"
          zip -r "$ZIP_NAME" "$PLUGIN_ID"

      - name: Upload Plugin ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archidb-fb25-datasource-plugin
          path: "*.zip"

